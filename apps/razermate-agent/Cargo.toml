[package]
name = "razermate-agent"
version.workspace = true
edition.workspace = true
description = "Basilisk V3 background agent: tray, hot-plug, per-app slot switching"

[[bin]]
name = "razermate-agent"
path = "src/main.rs"

[dependencies]
razer-core.workspace = true
razer-protocol.workspace = true
razer-ipc.workspace = true

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
]
